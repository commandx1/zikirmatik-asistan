# Yalnız yerel e2e testleri için (pnpm db:test). Veri tmpfs'te — kalıcı değil.
services:
  mongo-test:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27018:27017"
    tmpfs:
      - /data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}).ok }",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
