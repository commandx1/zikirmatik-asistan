# Render Free plan'da API instance boşta uyuduğu için in-process @Cron
# tick'leri kaçıyor. Bu workflow, sunucu tetikli push kampanyalarını dışarıdan
# tetikler: geri kazanım (winback), kandil arifesi + kandil günü ve haftalık
# özet. Uç nokta cihaz+gün başına push_dispatches unique index'iyle
# idempotenttir (rezervasyon-önce deseni, bkz. push-campaigns.service.ts), bu
# yüzden GH cron'un dakikalarca gecikmesi veya aynı gün tekrar tetiklenmesi
# güvenlidir — sorun değil, dedupe telafi eder.
#
# Gerekli repo secrets:
#   API_URL                 — örn. https://<service>.onrender.com (sondaki / olmadan)
#   CAMPAIGN_TRIGGER_SECRET — Render'daki env ile aynı değer
name: campaign-triggers

on:
  schedule:
    # 10:00 İstanbul (07:00 UTC) — geri kazanım (3/7 gün pasif kullanıcı)
    - cron: '0 7 * * *'
    # 18:00 İstanbul (15:00 UTC) — kandil arifesi (yarın kandil varsa)
    - cron: '0 15 * * *'
    # 09:00 İstanbul (06:00 UTC) — kandil günü (bugün kandil varsa)
    - cron: '0 6 * * *'
    # Pazartesi 09:00 İstanbul (06:00 UTC Pazartesi) — haftalık özet.
    # Not: kandil-day ile aynı UTC saatine denk gelir (her Pazartesi); GitHub
    # bu durumda İKİ ayrı run tetikler ve github.event.schedule ile aşağıda
    # ayrıştırılır — bu bir çakışma değildir.
    - cron: '0 6 * * 1'
    # 16:00 UTC — Amerika kıtası için ikinci tur (06:00 UTC orada gece yarısı;
    # sessiz saat artık cihazın yerel saatine göre). push_dispatches'ın
    # {deviceId, dayKey} unique index'i sabah alan cihaza ikinci push'u
    # engeller; dayKey İstanbul günü ve 16:00 UTC hâlâ aynı İstanbul günüdür.
    # Winback BİLEREK yok: pencere cihazın son görülmesine göre kaydığı için
    # ikinci tur, ertesi sabahki turla aynı cihaza iki gün üst üste
    # gönderebilirdi (günlük dedupe bunu engellemez).
    - cron: '0 16 * * *'
    - cron: '0 16 * * 1'
    # 02:00 UTC (05:00 İstanbul) — kandil arifesi için Asya-Pasifik turu:
    # 15:00 UTC, UTC+7 ve doğusundaki cihazlarda sessiz saate (22:00-08:00)
    # denk gelir. 05:00 İstanbul hâlâ İstanbul sessiz saatidir, yani İstanbul
    # cihazları bu turda gönderim almaz (sabah 08:00'de sessiz saat biter);
    # yalnızca yerel saati 08:00'i geçmiş doğudaki cihazlar alır. dayKey aynı
    # İstanbul günüdür, hedef tarih (yarın) 15:00 UTC turuyla aynıdır ve
    # {deviceId, dayKey} unique index'i 15:00 UTC'de ikinci push'u engeller.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      campaign:
        description: 'Tetiklenecek kampanya'
        required: true
        type: choice
        options:
          - winback
          - kandil-eve
          - kandil-day
          - weekly-summary

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve campaign
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "campaign=${{ inputs.campaign }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 7 * * *" ]; then
            echo "campaign=winback" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 15 * * *" ]; then
            echo "campaign=kandil-eve" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 6 * * *" ]; then
            echo "campaign=kandil-day" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 16 * * *" ]; then
            echo "campaign=kandil-day" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 2 * * *" ]; then
            echo "campaign=kandil-eve" >> "$GITHUB_OUTPUT"
          else
            echo "campaign=weekly-summary" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger campaign
        run: |
          # Render Free instance uykudan kalkarken ilk istek uzun sürebilir /
          # 5xx dönebilir; retry bunu tolere eder. Endpoint idempotent.
          curl --fail-with-body --silent --show-error \
            --retry 5 --retry-delay 20 --retry-all-errors \
            --max-time 120 \
            -X POST \
            -H "x-campaign-secret: ${{ secrets.CAMPAIGN_TRIGGER_SECRET }}" \
            "${{ secrets.API_URL }}/internal/campaigns/${{ steps.resolve.outputs.campaign }}"
