# Render Free instance 15 dk boşta kalınca uyuyor; 10 dk'da bir /health'e
# istek atarak uyanık tutar. GH cron birkaç dakika gecikebilir — kabul.
# Repo secret: API_URL (campaign-triggers ile ortak).
name: keep-alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 20 --retry-all-errors \
            --max-time 90 \
            "${{ secrets.API_URL }}/health"
