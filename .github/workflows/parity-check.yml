name: parity-check

on:
  pull_request:
  workflow_dispatch:

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install deps
        run: pnpm install --frozen-lockfile=false
      - name: Run screenshot diff gate
        run: pnpm parity:check
